<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bonnes Affaires — les meilleures offres du moment</title>
  <meta name="description" content="Les meilleures offres du moment en high-tech, maison, mode et voyages, mises à jour automatiquement.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="./">Bonnes<span>Affaires</span></a>
      <label class="search">
        <span class="sr">Rechercher une offre</span>
        <input id="q" type="search" placeholder="Rechercher un produit, une marque, un marchand…" autocomplete="off">
      </label>
    </div>
  </header>
  <div class="wrap" style="padding-top:14px"><p style="margin:0;padding:10px 14px;border:1px solid #e8d9a8;background:#fbf6e6;border-radius:8px;font-size:14px;color:#5c4a12"><strong>Version de test</strong> — site en cours de construction. Les offres affichées proviennent de Dealabs.</p></div>

  <main class="wrap">
    <nav class="filters" aria-label="Catégories">
      <div id="cats" class="chips" role="tablist"></div>
      <label class="sort">
        <span>Trier</span>
        <select id="sort">
          <option value="recent">Plus récentes</option>
          <option value="populaire">Populaires d'abord</option>
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
        </select>
      </label>
    </nav>

    <p id="status" class="status" aria-live="polite">Chargement des offres…</p>
    <section id="grid" class="grid" aria-label="Offres"></section>
    <button id="more" class="more" hidden>Voir plus d'offres</button>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p id="updated"></p>
      <p>Offres collectées automatiquement depuis des sites de bons plans. Les prix et la disponibilité peuvent changer : vérifiez sur le site d'origine avant d'acheter.</p>
    </div>
  </footer>

  <template id="card">
    <article class="card">
      <a class="card-link" target="_blank" rel="noopener noreferrer">
        <div class="thumb"></div>
        <div class="body">
          <div class="meta"><span class="cat"></span><span class="hot" hidden>Populaire</span></div>
          <h2 class="title"></h2>
          <div class="price-row"><span class="price"></span><span class="merchant"></span></div>
          <div class="footer-row"><span class="when"></span><span class="go">Voir l'offre →</span></div>
        </div>
      </a>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
