name: Collecte des offres et publication du site

on:
  schedule:
    - cron: "17 */2 * * *"   # toutes les 2 heures (heure UTC)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les offres
        run: python collector/collect.py || echo "::warning::Aucun flux lu, le site garde les offres précédentes"

      - name: Enregistrer les nouvelles offres
        run: |
          git config user.name "robot-bonnes-affaires"
          git config user.email "robot@users.noreply.github.com"
          git add site/data/deals.json
          git diff --cached --quiet || git commit -m "Mise à jour des offres"
          git pull --rebase --quiet || true
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
