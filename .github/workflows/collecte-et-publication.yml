name: Collecte des offres et publication du site

on:
  schedule:
    - cron: "17 */2 * * *"   # toutes les 2 heures (heure UTC)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte-et-envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les offres
        run: python collector/collect.py || echo "::warning::Aucun flux lu, le site garde les offres précédentes"

      - name: Enregistrer les nouvelles offres
        run: |
          git config user.name "robot-bonnes-affaires"
          git config user.email "robot@users.noreply.github.com"
          git add site/data/deals.json
          git diff --cached --quiet || git commit -m "Mise à jour des offres"
          git pull --rebase --quiet || true
          git push

      - name: Envoyer le site sur l'hébergement OVHcloud (SFTP)
        env:
          LFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then echo "::error::Le secret OVH_SFTP_PASSWORD est manquant"; exit 1; fi
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          lftp -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; mirror --reverse --delete --verbose site www; bye" --env-password -u mesbonr sftp://ftp.cluster129.hosting.ovh.net:22
